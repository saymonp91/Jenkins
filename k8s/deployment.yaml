apiVersion: apps/v1
kind: Deployment
metadata:
  name: minha-app
  namespace: production
  labels:
    app: minha-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: minha-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0          # zero-downtime deploy
  template:
    metadata:
      labels:
        app: minha-app
    spec:
      containers:
        - name: minha-app
          image: IMAGE_PLACEHOLDER  # substituído pelo Jenkins (sed)
          ports:
            - containerPort: 8000
          env:
            - name: ENVIRONMENT
              value: "production"
          envFrom:
            - secretRef:
                name: minha-app-secrets   # crie via: kubectl create secret generic ...
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
      imagePullSecrets:
        - name: ecr-secret              # veja script setup-ecr-secret.sh